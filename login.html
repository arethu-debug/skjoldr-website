    <section class="auth__card">
      <p class="auth__eyebrow">Team access</p>
      <h1 class="auth__title">Log in</h1>

      <div id="loginError" class="auth__error" role="alert" hidden><strong>Email or password is incorrect.</strong></div>
      <div id="loginExpired" class="auth__error" role="alert" hidden><strong>Your temporary password has expired.</strong> Ask your Skjoldr admin for a new one.</div>
      <div id="loginUnavailable" class="auth__error" role="alert" hidden><strong>Login is not available right now.</strong> Please contact your Skjoldr admin.</div>

      <form method="post" action="/api/login">
        <input type="hidden" name="next" id="next" value="/" />
        <div class="auth__field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required autofocus />
        </div>
        <div class="auth__field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <label class="auth__check"><input type="checkbox" id="remember" name="remember" value="1" /> Keep me signed in for 30 days</label>
        <button type="submit" class="auth__btn">Log in</button>
      </form>

      <p class="auth__help">Need access or a new password? Contact your Skjoldr admin.</p>
    </section>
    <p class="auth__foot">Skjoldr AS · Shared Vision</p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('next')) document.getElementById('next').value = params.get('next');
    if (params.get('error') === 'unavailable') document.getElementById('loginUnavailable').hidden = false;
    else if (params.get('error') === 'expired') document.getElementById('loginExpired').hidden = false;
    else if (params.get('error')) document.getElementById('loginError').hidden = false;
  </script>
</body>
</html>
